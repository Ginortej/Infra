<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- Заголовок окна (frameless, как в Obsidian) -->
    <header class="titlebar" data-wails-drag>
      <div class="titlebar-left">
        <span class="logo">◆</span>
        <span class="vault-name">MyInfra</span>
      </div>
      <button class="titlebar-search" id="openPalette" title="Палитра команд (Ctrl+P)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Поиск или команда</span>
        <kbd>Ctrl P</kbd>
      </button>
      <div class="win-controls">
        <button title="Свернуть"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button title="Развернуть"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
        <button class="close" title="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </header>

    <div class="body">
      <!-- Лента модулей -->
      <nav class="ribbon" id="ribbon">
        <button data-panel="servers" class="active" title="Серверы">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
        </button>
        <button data-panel="vpn" title="VPN">
          <svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
        </button>
        <button data-panel="labs" title="Лабы">
          <svg viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
        </button>
        <button data-panel="scripts" title="Скрипты">
          <svg viewBox="0 0 24 24"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></svg>
        </button>
        <div class="ribbon-spacer"></div>
        <button data-action="settings" title="Настройки">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        </button>
      </nav>

      <!-- Боковая панель -->
      <aside class="sidebar" id="sidebar"></aside>
      <div class="resizer" id="resizer"></div>

      <!-- Рабочая область -->
      <main class="workspace">
        <div class="tabbar" id="tabbar"></div>
        <section class="view" id="view"></section>
      </main>
    </div>

    <!-- Статус-бар -->
    <footer class="statusbar" id="statusbar"></footer>
  </div>

  <!-- Палитра команд -->
  <div class="palette-backdrop" id="paletteBackdrop" hidden>
    <div class="palette">
      <input id="paletteInput" placeholder="Подключиться, запустить лабу, включить VPN…" autocomplete="off" spellcheck="false">
      <ul id="paletteList"></ul>
      <div class="palette-hint"><span><kbd>↑↓</kbd> выбор</span><span><kbd>Enter</kbd> выполнить</span><span><kbd>Esc</kbd> закрыть</span></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
