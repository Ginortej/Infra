<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infra</title>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="titlebar-left">
        <button class="side-toggle" id="sideToggle" title="Скрыть/показать панель (Ctrl+B)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <button class="vault-btn" id="vaultBtn" title="Хранилище"><span class="logo">◆</span><span class="vault-name" id="vaultName">Infra</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <button class="titlebar-search" id="openPalette" title="Палитра команд (Ctrl+P)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Поиск или команда</span><kbd>Ctrl P</kbd>
      </button>
      <button class="chat-btn" id="chatBtn" title="Чат с ИИ (Ctrl+J)"><svg viewBox="0 0 24 24"><path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-5 4v-4H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/></svg><span>ИИ</span></button>
      <div class="win-controls">
        <button id="winMin" title="Свернуть"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button id="winMax" title="Развернуть"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
        <button id="winClose" class="close" title="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </header>

    <div class="body">
      <div class="vault-screen" id="vaultScreen"></div>
      <nav class="ribbon" id="ribbon">
        <button data-panel="files" title="Хранилище"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
        <button data-panel="servers" title="Серверы"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></button>
        <button data-panel="vpn" title="VPN"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg></button>
        <button data-panel="labs" title="Лабы"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg></button>
        <button data-panel="scripts" title="Скрипты"><svg viewBox="0 0 24 24"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></svg></button>
        <button data-panel="git" title="Git"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9c0 5-6 4-11.5 8.5"/></svg></button>
        <button data-panel="ai" title="ИИ: агенты, модели, MCP"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></button>
        <button data-panel="market" title="Маркет ИИ: модели и агенты"><svg viewBox="0 0 24 24"><path d="M4 9 5.5 4h13L20 9M4 9h16v2a3 3 0 0 1-5.3 2A3 3 0 0 1 12 14a3 3 0 0 1-2.7-1A3 3 0 0 1 4 11zM5 13.5V20h14v-6.5M10 20v-4h4v4"/></svg></button>
        <button data-panel="aiset" title="Настройки ИИ: MCP, база знаний, безопасность"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><circle cx="12" cy="11.5" r="2.5"/><path d="M12 7.5V9M12 14v1.5M8.5 11.5H10M14 11.5h1.5"/></svg></button>
        <div class="ribbon-spacer"></div>
        <button data-action="settings" title="Настройки (Ctrl+,)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
      </nav>
      <aside class="sidebar" id="sidebar"></aside>
      <div class="resizer" id="resizer"></div>
      <main class="workspace">
        <div class="tabbar" id="tabbar"></div>
        <section class="view" id="view"></section>
      </main>
    </div>

    <footer class="statusbar" id="statusbar"><button class="sysw" id="sysWidget" title="Загрузка системы — нажми для подробностей"></button></footer>
  </div>

  <div class="palette-backdrop" id="paletteBackdrop" hidden>
    <div class="palette">
      <input id="paletteInput" placeholder="Подключиться, запустить скрипт, включить VPN…" autocomplete="off" spellcheck="false">
      <ul id="paletteList"></ul>
      <div class="palette-hint"><span><kbd>↑↓</kbd> выбор</span><span><kbd>Enter</kbd> выполнить</span><span><kbd>Esc</kbd> закрыть</span></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
